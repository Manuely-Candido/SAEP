<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>CADASTRO DE RESPONSÁVEL</h1>
    <form action="/responsavel" method="post">
        <p>Nome</p>
        <input type="text" name="nome">
        <p>CPF</p>
        <input type="text" name="cpf">
        <button type="submit">CADASTRAR</button>
    </form>

    <h1>BUSCAR RESPONSÁVEL</h1>
    <form action="/responsavel" method="get">
        <p>Buscar por nome</p>
        <input type="text" name="busca">
        <button type="submit">BUSCAR</button>
    </form>

    <h1>RESPONSAVEIS CADASTRADOS</h1>
    <table>
        <tr>
            <th>ID RESPONSAVEL</th>
            <th>CPF</th>
            <th>NOME</th>
            <th>BOTOES</th>
        </tr>

        {% for responsavel in responsaveis %}
        <tr>
            <form action="/alterar" method="post">
                <td>
                    <input type="text" name="idresponsavel" value="{{responsavel.get("idresponsavel")}}">
                </td>
                <td>
                    <input type="text" name="cpf" value="{{responsavel.get("cpf")}}">
                </td>
                <td>
                    <input type="text" name="nome" value={{responsavel.get("nome")}}">
                </td>

                <td>
                    <a href="/excluir_responsavel/{{responsavel.get("idresponsavel")}}">EXCLUIR</a>
                    <button type="submit">ALTERAR</button>
                </td>
            </form>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
